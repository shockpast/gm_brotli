name: Build Linux modules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux32
            target: i686-unknown-linux-gnu
            module: gmsv_brotli_linux.dll
          - platform: linux64
            target: x86_64-unknown-linux-gnu
            module: gmsv_brotli_linux64.dll

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-multilib libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release module
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package module
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libgmsv_brotli.so dist/${{ matrix.module }}

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: gmsv_brotli-${{ matrix.platform }}
          path: dist/${{ matrix.module }}
          if-no-files-found: error
